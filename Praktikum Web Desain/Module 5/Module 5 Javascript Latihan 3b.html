<!DOCTYPE html>
<html>
<head>
    <title>Animasi Transisi</title>
    <meta name="viewport" content="width-device-width, intial-scale=1.0">

    <style type="text/css">
        .box{
            width: 200px;
            height: 200px;
            background: orange;
            border: 2px solid #212121;
            margin: 50px auto;
            transition: all 1s ease;
        }

        @keyframes putar {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @media screen and (orientation: landscape) {
            .box {
                background: blue;
                width: 80%;        
                height: 80px;      
                border-radius: 50%;
                animation: putar 2s linear infinite;
            }
        }
    </style>
</head>
<body>
<h3>Transisi CSS3</h3>

    <div class="box"></div>
    <p>
        ubah orientasi ke landscape/potrait dan sebaliknya untuk melihat efek transisi
    </p>
</body>
</html>
